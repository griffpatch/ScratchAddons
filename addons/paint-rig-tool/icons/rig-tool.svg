<?xml version="1.0" encoding="UTF-8"?>
<!-- Rig tool icon: two bone-end circles connected by a limb, with an orange pivot joint -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- Bone endpoints -->
  <circle cx="3.5" cy="4" r="2.5" fill="#575e75"/>
  <circle cx="16.5" cy="16" r="2.5" fill="#575e75"/>
  <!-- Bone shaft -->
  <line x1="5.8" y1="6" x2="14.2" y2="14" stroke="#575e75" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Pivot joint (orange crosshair) -->
  <circle cx="10" cy="10" r="3.5" fill="white" stroke="#FF6B00" stroke-width="1.8"/>
  <line x1="7.5" y1="10" x2="12.5" y2="10" stroke="#FF6B00" stroke-width="1.4"/>
  <line x1="10" y1="7.5" x2="10" y2="12.5" stroke="#FF6B00" stroke-width="1.4"/>
</svg>
